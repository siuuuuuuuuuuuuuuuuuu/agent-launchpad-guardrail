name: CD

# Gated on the CI workflow's own success for the same commit, rather than a
# plain `push` trigger — CD should never run on code that hasn't already
# passed `npm run check`. Never triggers for pull_request (including from
# forks), so registry/cluster credentials never reach untrusted code.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ vars.CR_REGISTRY }}
          username: ${{ secrets.CR_USERNAME }}
          password: ${{ secrets.CR_PASSWORD }}

      - id: image
        run: echo "image=${{ vars.CR_REGISTRY }}/launchpad/agent-launchpad" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ github.event.workflow_run.head_sha }}
            ${{ steps.image.outputs.image }}:latest

  # Requires a Kubernetes API server the runner can actually reach. The
  # cluster from deploy/volcengine-k8s restricts its API server to
  # var.allowed_api_cidr (deliberately never 0.0.0.0/0) — GitHub-hosted
  # runners have no fixed, allowlist-able IP range. Before this job can
  # succeed, pick one: widen allowed_api_cidr to GitHub's published Actions
  # ranges (large, they churn), run a self-hosted runner inside the VPC, or
  # front the API server with a bastion/VPN. See docs/DEPLOYMENT.md.
  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: azure/setup-helm@v5
        with:
          version: v3.16.2

      # KUBE_CONFIG_DATA is the cluster's kubeconfig, base64-encoded.
      # base64 avoids known issues with GitHub's secret masking on
      # multi-line values. Produce it with:
      #   terraform -chdir=deploy/volcengine-k8s output -raw kubeconfig | base64
      - run: |
          mkdir -p "$HOME/.kube"
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - run: |
          helm upgrade --install launchpad deploy/helm/launchpad \
            -f deploy/helm/launchpad/values-production.yaml \
            --set image.repository=${{ needs.build-and-push.outputs.image }} \
            --set image.tag=${{ github.event.workflow_run.head_sha }} \
            --namespace launchpad --create-namespace \
            --wait --timeout 5m
